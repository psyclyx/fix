name: CI

on:
  push:

permissions:
  contents: read

# Pushes often land minutes apart while a full run still holds macOS
# runners (a ~5-slot pool that provisions slowly); superseded runs must
# release them immediately or runs starve each other for half an hour.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One build per (system, optimize) feeds every consumer that needs only
  # the BINARY (the eval groups, the gc detector, both daemon arms) —
  # previously each of those built fix from a cold zig cache. Consumers
  # run inside the same pinned nix-shell, so the artifact's dynamic deps
  # (curl/libgit2/glibc store paths) resolve identically. Darwin builds
  # in its own job so a macOS runner drought never blocks the linux
  # pipeline.
  build:
    name: build / ${{ matrix.system }} ${{ matrix.optimize }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            optimize: ReleaseFast
            artifact: fix-releasefast-x86_64-linux
          - system: x86_64-linux
            runner: ubuntu-24.04
            optimize: ReleaseSafe
            artifact: fix-releasesafe-x86_64-linux
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            optimize: ReleaseFast
            artifact: fix-releasefast-aarch64-linux
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          key: nix-v4-build-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
      # Zig caches persist across runs (keyed to HEAD, prefix-restored from
      # the newest prior run). Only the zig builds share these; the nix
      # package build is hermetic by design and must not see them.
      - name: Restore zig cache
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-build-${{ matrix.system }}-${{ matrix.optimize }}-${{ github.sha }}
          restore-keys: |
            zig-build-${{ matrix.system }}-${{ matrix.optimize }}-
      # -Dcpu=baseline: the artifact crosses machines within an arch pool
      # (heterogeneous hosted fleet — a native build SIGILLs on boxes missing
      # the builder's ISA extensions), and baseline matches the nix package
      # (nix/fix.nix cpu ? "baseline"), so CI exercises the same ISA target
      # module users compile.
      - name: Build ${{ matrix.optimize }}
        timeout-minutes: 20
        run: |
          nix-shell --run 'zig build -Doptimize=${{ matrix.optimize }} -Dcpu=baseline --summary all'
          cp zig-out/bin/fix ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 3
      # Last step on purpose: skipped when anything above failed, so a broken
      # job can never publish a poisoned store snapshot.
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-v4-build-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}

  build-darwin:
    name: build / aarch64-darwin ReleaseFast
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          key: nix-v4-build-aarch64-darwin-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
      - name: Restore zig cache
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-build-aarch64-darwin-ReleaseFast-${{ github.sha }}
          restore-keys: |
            zig-build-aarch64-darwin-ReleaseFast-
      - name: Build ReleaseFast
        timeout-minutes: 20
        run: |
          nix-shell --run 'zig build -Doptimize=ReleaseFast -Dcpu=baseline --summary all'
          cp zig-out/bin/fix fix-releasefast-aarch64-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: fix-releasefast-aarch64-darwin
          path: fix-releasefast-aarch64-darwin
          retention-days: 3
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-v4-build-aarch64-darwin-${{ hashFiles('**/*.nix', 'npins/sources.json') }}

  test:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          key: nix-v4-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
      # Shared across ALL zig builds in this job (suite test binaries are the
      # bulk of the compile time). The nix package build below is hermetic
      # (its own TMPDIR cache) and intentionally excluded.
      - name: Restore zig cache
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-test-${{ matrix.system }}-${{ github.sha }}
          restore-keys: |
            zig-test-${{ matrix.system }}-
      - name: Build
        timeout-minutes: 20
        run: nix-shell --run 'zig build -Doptimize=ReleaseFast --summary all'

      - name: Build pinned Nix package
        timeout-minutes: 20
        run: nix-build default.nix -A fix --no-out-link

      - name: Static checks
        timeout-minutes: 10
        run: nix-shell --run 'zig build check-static --summary all'

      - name: Model-check concurrency protocols
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 10
        run: nix-shell --run 'zig build check-models --summary all'

      - name: Base tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-base --verbose --summary all'

      - name: Syntax tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-syntax --verbose --summary all'

      - name: Runtime tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-runtime --verbose --summary all'

      - name: Store tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-store --verbose --summary all'

      - name: Fetcher tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-fetchers --verbose --summary all'

      - name: Evaluator tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-expr --verbose --summary all'

      - name: Focused concurrency tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-concurrency --verbose --summary all'

      # ReleaseSafe: safety checks stay on while the optimizer elides the
      # dead union operand copies that safe-Debug lowering materializes,
      # which alias embedded atomics and would report as artifact races.
      - name: ThreadSanitizer concurrency tests
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 20
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:suppressions=${{ github.workspace }}/test/tsan.supp
        run: nix-shell --run 'zig build test-concurrency -Dtsan -Doptimize=ReleaseSafe --verbose --summary all'

      - name: Integration tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-integration --verbose --summary all'

      - name: CLI tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-cli --verbose --summary all'

      # After the suites on purpose: every test binary above is already built
      # and its run step cached, so re-entering `zig build test` here only
      # replays their output for the census to count.
      - name: Test census
        timeout-minutes: 12
        run: nix-shell --run 'bash tools/test_census.sh .'

      - name: Flake end-to-end tests
        timeout-minutes: 7
        run: nix-shell --run 'zig build test-e2e --summary all -- flake'

      - name: REPL end-to-end tests
        timeout-minutes: 7
        run: nix-shell --run 'zig build test-e2e --summary all -- repl'

      - name: Language conformance
        timeout-minutes: 20
        run: nix-shell --run 'zig build test-lang -Doptimize=ReleaseFast --summary all'

      - name: Benchmark fixture differential
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 15
        run: nix-shell --run 'zig build test-bench-fixtures -Doptimize=ReleaseFast --summary all'

      # Last step on purpose: it is skipped when anything above failed, so a
      # broken job can never publish a poisoned store snapshot.
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-v4-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}

  # Native runners on purpose: the aarch64 arms are the only place the
  # weak-memory-ordering code paths (deque/future fences) run on real
  # hardware — qemu inherits the x86 host's TSO and hides those bugs.
  # Each platform evaluates its NATIVE universe (outpaths systems = null
  # -> currentSystem), so oracles are per-system.
  #
  # Each group job walks 3 of the 12 universe chunks; per chunk it runs
  # the default and tight gc-budget lanes, each COLD (compiled-chunk
  # cache wiped first) and then WARM (the identical eval answered through
  # the persistent cache's read path). Chunks are grouped because
  # per-chunk jobs spent more wall time on runner setup than on eval —
  # and 72 of them starved the runner pools.
  nixpkgs-eval:
    name: nixpkgs / ${{ matrix.system }} group ${{ matrix.group }}
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
        system: [x86_64-linux, aarch64-linux]
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          key: nix-v4-eval-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
      - name: Restore oracle cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/fix-nixpkgs-eval
          key: nixpkgs-oracle-v2-${{ hashFiles('npins/sources.json') }}-${{ matrix.system }}-group-${{ matrix.group }}
      - uses: actions/download-artifact@v8
        with:
          name: fix-releasefast-${{ matrix.system }}
      - name: Differential eval (3 chunks x 2 lanes, cold+warm)
        timeout-minutes: 45
        run: |
          chmod +x fix-releasefast-${{ matrix.system }}
          nix-shell --run '
            set -euo pipefail
            for i in 0 1 2; do
              chunk=$(( 3 * ${{ matrix.group }} + i ))
              for budget in 1024 512; do
                rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/fix/chunks"
                test/nixpkgs/run.sh --chunk $chunk/12 --gc-budget $budget --fix ./fix-releasefast-${{ matrix.system }}
                test/nixpkgs/run.sh --chunk $chunk/12 --gc-budget $budget --fix ./fix-releasefast-${{ matrix.system }}
              done
            done
          '
      # Last step on purpose: it is skipped when anything above failed, so a
      # broken job can never publish a poisoned store snapshot.
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-v4-eval-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}

  # macos-15 runners have 7 GB RAM; a 1024-budget chunk peaks near 10 GB,
  # so darwin's lanes sit one rung lower (512 default, 256 tight).
  nixpkgs-eval-darwin:
    name: nixpkgs / aarch64-darwin group ${{ matrix.group }}
    runs-on: macos-15
    needs: build-darwin
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          key: nix-v4-eval-aarch64-darwin-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
      - name: Restore oracle cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/fix-nixpkgs-eval
          key: nixpkgs-oracle-v2-${{ hashFiles('npins/sources.json') }}-aarch64-darwin-group-${{ matrix.group }}
      - uses: actions/download-artifact@v8
        with:
          name: fix-releasefast-aarch64-darwin
      - name: Differential eval (3 chunks x 2 lanes, cold+warm)
        timeout-minutes: 45
        run: |
          chmod +x fix-releasefast-aarch64-darwin
          nix-shell --run '
            set -euo pipefail
            for i in 0 1 2; do
              chunk=$(( 3 * ${{ matrix.group }} + i ))
              for budget in 512 256; do
                rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/fix/chunks"
                test/nixpkgs/run.sh --chunk $chunk/12 --gc-budget $budget --fix ./fix-releasefast-aarch64-darwin
                test/nixpkgs/run.sh --chunk $chunk/12 --gc-budget $budget --fix ./fix-releasefast-aarch64-darwin
              done
            done
          '
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-v4-eval-aarch64-darwin-${{ hashFiles('**/*.nix', 'npins/sources.json') }}

  # GC use-after-free tripwire: chunk 0 at a tight budget was the workload
  # that exposed the w>1 collection races (2026-08: native-handoff result
  # rooting; the swept force_thunk task root). ReleaseSafe is the detector
  # build — reuse off, alloc-bitmap liveness asserts on every id read, and
  # swept-slot poisoning that makes a stale claim panic at the deref instead
  # of segfaulting one run in thirty.
  nixpkgs-gc-detector:
    name: nixpkgs / gc detector (chunk 0, tight budget)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6
      # Restore-only: the x86_64-linux eval jobs own this snapshot key.
      - uses: ./.github/actions/setup-nix
        with:
          key: nix-v4-eval-x86_64-linux-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
      - name: Restore oracle cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/fix-nixpkgs-eval
          key: nixpkgs-oracle-v2-${{ hashFiles('npins/sources.json') }}-x86_64-linux-group-0
      - uses: actions/download-artifact@v8
        with:
          name: fix-releasesafe-x86_64-linux
      - name: Tight-budget detector eval
        timeout-minutes: 25
        run: |
          chmod +x fix-releasesafe-x86_64-linux
          nix-shell --run 'test/nixpkgs/run.sh --chunk 0/12 --gc-budget 512 --workers 4 --fix ./fix-releasesafe-x86_64-linux'

  daemon-compat:
    name: daemon / ${{ matrix.implementation }}
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        implementation: [cppnix, lix]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          key: daemon-v4-${{ matrix.implementation }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
          installer: ${{ matrix.implementation }}
      - name: Report daemon implementation
        run: nix --version
      - uses: actions/download-artifact@v8
        with:
          name: fix-releasefast-x86_64-linux
      - name: Real-daemon compatibility
        timeout-minutes: 10
        env:
          FIX_REQUIRE_DAEMON: "1"
        run: |
          chmod +x fix-releasefast-x86_64-linux
          nix-shell --run 'bash test/e2e/daemon.sh ./fix-releasefast-x86_64-linux'
      # Last step on purpose: it is skipped when anything above failed, so a
      # broken job can never publish a poisoned store snapshot.
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: daemon-v4-${{ matrix.implementation }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
